# docker-compose.yml

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: gaming-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=gaming_house
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gaming-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cloud Server (Reservations)
  cloud:
    build:
      context: ./cloud_server
      dockerfile: Dockerfile
    container_name: gaming-cloud
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/cloud_db
      - LOCAL_SERVER_URL=http://host.docker.internal:8003
      - CENTER_ID=main
      - ENV=production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gaming-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Local Server (Gaming Center)
  local:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gaming-local
    restart: unless-stopped
    ports:
      - "8003:8003"
      - "9000:9000/udp"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/gaming_house
      - CLOUD_API_URL=http://cloud:5000
      - CENTER_ID=main
      - SYNC_INTERVAL=10
      - JWT_SECRET_KEY=your-super-secret-key
    depends_on:
      db:
        condition: service_healthy
      cloud:
        condition: service_started
    networks:
      - gaming-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend
  frontend:
    build:
      context: ./egaming-frontend
      dockerfile: Dockerfile
    container_name: gaming-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8003
    depends_on:
      - local
    networks:
      - gaming-network

  # ngrok tunnel for cloud server
  ngrok:
    image: ngrok/ngrok:latest
    container_name: gaming-ngrok
    restart: unless-stopped
    ports:
      - "4040:4040"  # ngrok web interface
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTH_TOKEN}
    command:
      - "http"
      - "--log=stdout"
      - "--log-level=info"
      - "cloud:5000"
    depends_on:
      - cloud
    networks:
      - gaming-network

volumes:
  postgres_data:

networks:
  gaming-network:
    driver: bridge
    name: gaming-network