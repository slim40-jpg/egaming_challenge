# haproxy.cfg

global
    # Windows specific
    daemon
    maxconn 256
    
defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

# Frontend: Listen on port 8080
frontend http-in
    bind *:8080
    
    # Logging
    option httplog
    option forwardfor
    
    # Define ACLs (Access Control Lists) based on URL path
    acl is_reservation path_beg /api/reservations
    acl is_sync path_beg /api/sync
    acl is_health path_beg /health
    
    # Route to appropriate backend
    use_backend cloud_server if is_reservation or is_sync or is_health
    default_backend local_server

# Backend 1: Cloud Server (Reservations)
backend cloud_server
    # Send requests to cloud_server.py on port 5000
    server cloud-server localhost:5000 check inter 2000 rise 2 fall 3

# Backend 2: Local Server (PC Management)
backend local_server
    # Send requests to server.py on port 8003
    server local-server localhost:8003 check inter 2000 rise 2 fall 3